name: mind-quest
services:
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: postgres-mind-quest
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=mind_quest_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
    driver: local
